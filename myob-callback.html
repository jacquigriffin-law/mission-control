<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MYOB authorisation received</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201c;
      --muted: #5f6b66;
      --line: #d7ddd9;
      --panel: #f7faf8;
      --accent: #1f6f5b;
      --accent-dark: #174f42;
      --warn: #7a4a11;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      background: var(--panel);
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 16px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 16px 0 6px;
    }

    textarea,
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #ffffff;
      color: var(--ink);
    }

    textarea {
      min-height: 104px;
      resize: vertical;
    }

    button {
      margin-top: 8px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    .warning {
      color: var(--warn);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>MYOB authorisation received</h1>
    <p>This static page stores nothing. Copy the full redirected URL or the code and businessId into the Mac mini setup command.</p>
    <p class="warning" id="missing" hidden>No code was found in this URL. Check that MYOB redirected back with a code query parameter.</p>

    <label for="fullUrl">Full redirected URL</label>
    <textarea id="fullUrl" readonly></textarea>
    <button type="button" data-copy="fullUrl">Copy full URL</button>

    <label for="code">Code</label>
    <input id="code" readonly>
    <button type="button" data-copy="code">Copy code</button>

    <label for="businessId">Business ID</label>
    <input id="businessId" readonly>
    <button type="button" data-copy="businessId">Copy businessId</button>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const values = {
        fullUrl: window.location.href,
        code: params.get("code") || "",
        businessId: params.get("businessId") || params.get("businessid") || ""
      };

      Object.entries(values).forEach(([id, value]) => {
        document.getElementById(id).value = value;
      });

      document.getElementById("missing").hidden = Boolean(values.code);

      document.querySelectorAll("[data-copy]").forEach((button) => {
        button.addEventListener("click", async () => {
          const target = document.getElementById(button.dataset.copy);
          await navigator.clipboard.writeText(target.value);
          button.textContent = "Copied";
          window.setTimeout(() => {
            button.textContent = button.dataset.copy === "fullUrl" ? "Copy full URL" : `Copy ${button.dataset.copy}`;
          }, 1200);
        });
      });
    })();
  </script>
</body>
</html>
